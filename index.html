<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#86dce5" />
    <link rel="icon" href="data:," />
    <title>First Flight</title>
  </head>
  <body>
    <main id="app" aria-label="First Flight">
      <canvas aria-label="First Flight obstacle course" tabindex="0"></canvas>
      <header class="hud">
        <div class="brand"><span id="brand-icon" aria-hidden="true"></span>FIRST FLIGHT</div>
        <div class="scoreboard">
          <div class="score"><span>SCORE</span><output id="score" aria-label="Score">00</output></div>
          <div class="score record"><span>BEST</span><output id="best" aria-label="Best score">00</output></div>
        </div>
      </header>
      <nav class="tools" aria-label="Game controls">
        <button id="pause" class="tool" type="button" aria-label="Pause flight" title="Pause flight" aria-pressed="false" disabled></button>
        <button id="mute" class="tool" type="button" aria-label="Mute sound" title="Mute sound" aria-pressed="false"></button>
      </nav>
      <section id="overlay" aria-label="Flight controls">
        <div><span id="status">OPEN SKY</span><h1 id="state-title">First Flight</h1></div>
        <button id="action" type="button" aria-label="Start flight" title="Start flight"></button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
