<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#86dce5" />
    <link rel="icon" href="data:," />
    <title>First Flight</title>
  </head>
  <body>
    <main id="app" aria-label="First Flight">
      <canvas aria-label="First Flight obstacle course" tabindex="0"></canvas>
      <header class="hud">
        <div class="brand"><span id="brand-icon" aria-hidden="true"></span>FIRST FLIGHT</div>
        <div class="score"><span>SCORE</span><output id="score" aria-label="Score">00</output></div>
      </header>
      <section id="overlay" aria-label="Flight controls">
        <div><span id="status">OPEN SKY</span><h1 id="state-title">First Flight</h1></div>
        <button id="action" type="button" aria-label="Start flight" title="Start flight"></button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
